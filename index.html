<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-SANDBOX 2D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1b2331; --panel: #243044; --grid: rgba(150,175,215,0.07);
            --frame: #b9bec9; --hi: #e6e9ef; --lo: #7b8493; --ink: #121926; --gold: #ffd23f;
            --pix: 'Silkscreen', 'Courier New', monospace;
            --lbl: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: #fff; font-family: var(--lbl);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #main-container { display: flex; flex: 1; min-height: 0; }
        #canvas-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center; position: relative; min-width: 0;
            background-color: #0d121b;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        canvas { image-rendering: pixelated; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px #3a475e, 0 8px 30px rgba(0,0,0,0.8); cursor: crosshair; }
        #hud {
            position: absolute; top: 10px; left: 10px; background: rgba(18,25,38,0.9); padding: 6px 10px;
            font: 700 11px/1.5 var(--pix); pointer-events: none; border: 2px solid #3a475e; color: #cfd8e8;
        }
        #hud b { color: var(--gold); }
        #palette {
            width: 470px; max-width: 46vw; overflow-y: auto; padding: 12px 14px 18px; border-left: 3px solid var(--ink);
            background-color: var(--panel);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        #palette::-webkit-scrollbar { width: 10px; } #palette::-webkit-scrollbar-thumb { background: #4a5a78; border: 2px solid var(--panel); }
        .panel-title { text-align: center; font: 700 19px/1.15 var(--pix); letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
        .panel-title small { display: block; font-size: 11px; color: var(--gold); margin-top: 4px; letter-spacing: 2px; }
        #search-box {
            width: 100%; margin: 10px 0 4px; padding: 7px 9px; background: #151c29; border: 2px solid #3a475e; color: #fff;
            font: 500 13px var(--lbl); outline: none; user-select: text;
        }
        #search-box:focus { border-color: var(--gold); }
        .sec-title {
            text-align: center; margin: 14px 0 9px; font: 700 12.5px/1.2 var(--pix); letter-spacing: 0.5px; text-transform: uppercase;
            text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink);
        }
        .elements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 9px 6px; }
        .tile { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-family: var(--lbl); }
        .tile .frame {
            width: 54px; height: 54px; background: var(--frame); border: 3px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
            box-shadow: 0 0 0 2px var(--ink); display: block; transition: transform .08s;
        }
        .tile .frame img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        .tile .lbl {
            font: 700 10.5px/1.05 var(--lbl); text-align: center; min-height: 22px; display: flex; align-items: center;
            text-shadow: -1px 0 var(--ink), 1px 0 var(--ink), 0 -1px var(--ink), 0 1px var(--ink), 0 2px 0 var(--ink);
        }
        .tile:hover .frame { transform: translateY(-2px); filter: brightness(1.1); }
        .tile.active .frame { box-shadow: 0 0 0 2px var(--ink), 0 0 0 5px var(--gold), 0 0 14px 4px rgba(255,210,63,0.45); }
        .tile.active .lbl { color: var(--gold); }
        #bottom-bar {
            background: #121926; border-top: 3px solid #3a475e; padding: 7px 12px; display: flex; flex-wrap: wrap;
            align-items: center; gap: 8px 22px; justify-content: space-between;
        }
        .grp { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .ibtn {
            width: 48px; height: 48px; border: none; background: transparent center/100% 100% no-repeat; cursor: pointer;
            position: relative; image-rendering: pixelated; filter: drop-shadow(0 3px 0 var(--ink)); transition: transform .08s, filter .1s;
        }
        .ibtn.small { width: 32px; height: 32px; }
        .ibtn:hover { filter: drop-shadow(0 3px 0 var(--ink)) brightness(1.12); }
        .ibtn:active { transform: translateY(2px); }
        .ibtn.on { filter: drop-shadow(0 0 0 var(--ink)) drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold)); }
        .ibtn .badge { position: absolute; right: -2px; bottom: -4px; font: 700 10px var(--pix); background: var(--ink); color: var(--gold); padding: 1px 3px; border: 1px solid #3a475e; }
        .brush-box { display: flex; align-items: center; gap: 8px; font: 700 11px var(--pix); color: #cfd8e8; }
        .brush-box b { color: var(--gold); display: inline-block; min-width: 18px; text-align: center; }
        input[type="range"] { width: 90px; accent-color: var(--gold); }
        .pbtn {
            font: 700 11px var(--pix); text-transform: uppercase; color: #fff; background: #2d3a52; cursor: pointer;
            padding: 8px 10px; border: 2px solid; border-color: #5d6f93 #151c29 #151c29 #5d6f93; box-shadow: 0 0 0 2px var(--ink);
        }
        .bi { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; pointer-events: none; }
        .bi.only { margin-right: 0; }
        .pbtn:hover { background: #3a4a69; color: var(--gold); }
        .pbtn:active { transform: translateY(1px); }
        .pbtn.active { background: var(--gold); color: var(--ink); }
        .pbtn.danger:hover { background: #d63a52; color: #fff; }

        @media (max-width: 860px) {
            #main-container { flex-direction: column; }
            #canvas-wrapper { flex: 0 0 38%; order: 1; }
            #palette { width: 100%; max-width: none; flex: 1; order: 2; border-left: none; border-top: 3px solid var(--ink); }
            .panel-title { font-size: 15px; }
            #bottom-bar { justify-content: center; gap: 6px 12px; padding: 6px; }
            .ibtn { width: 44px; height: 44px; } .ibtn.small { width: 38px; height: 38px; }
        }
        .tile.alt .frame { box-shadow: 0 0 0 2px var(--ink), 0 0 0 5px #4fc3ff; }
        .tile.alt.active .frame { box-shadow: 0 0 0 2px var(--ink), 0 0 0 5px var(--gold), 0 0 0 8px #4fc3ff; }
        .help { font: 500 10.5px/1.35 var(--lbl); color: #9fb0cc; text-align: center; margin: 2px 0 2px; }
        #toast { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--gold);
                 border: 2px solid #3a475e; padding: 6px 12px; font: 700 12px var(--pix); opacity: 0; transition: opacity .25s; pointer-events: none; }
        #toast.show { opacity: 1; }
        canvas { touch-action: none; }
        #canvas-wrapper { overflow: hidden; }
        #main-container { overflow: hidden; }
        #save-modal { position: fixed; inset: 0; background: rgba(5,8,14,0.78); display: none; align-items: center; justify-content: center; z-index: 50; }
        #save-modal.show { display: flex; }
        #save-modal .box { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 0 0 2px #3a475e; padding: 14px 16px; width: min(580px, 94vw); max-height: 92vh; overflow: auto; }
        #save-modal h2 { font: 700 15px var(--pix); text-align: center; margin-bottom: 8px; text-shadow: 0 2px 0 var(--ink); }
        .slot { display: flex; gap: 10px; align-items: center; background: #151c29; border: 2px solid #3a475e; padding: 6px; margin: 6px 0; }
        .slot.cur { border-color: var(--gold); }
        .slot img, .slot .noimg { width: 102px; height: 63px; background: #0d121b; border: 1px solid #3a475e; flex: none; image-rendering: auto; }
        .slot .meta { flex: 1; font: 500 12px/1.35 var(--lbl); min-width: 0; }
        .slot .meta b { color: var(--gold); font-family: var(--pix); font-size: 11px; }
        .slot .acts { display: flex; flex-direction: column; gap: 4px; }
        .slot .pbtn { padding: 4px 7px; font-size: 10px; }
        #save-modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

        /* ===== THE POWDER TOY LOOK (v16) ===== */
        html, body { background: #000; }
        body { font-family: var(--pix); }
        #main-container { background: #000; }
        #canvas-wrapper { background: #000 !important; background-image: none !important; }
        canvas { box-shadow: 0 0 0 1px #6a6a6a !important; }
        #hud { background: none; border: 0; padding: 4px 8px; font: 400 12px/1.5 var(--pix); color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; z-index: 2; }
        #hud b { color: #fff; font-weight: 400; }
        #sidebar { width: 108px; flex: none; background: #000; border-left: 1px solid #8a8a8a; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding: 4px; }
        #sidebar::-webkit-scrollbar { width: 6px; } #sidebar::-webkit-scrollbar-thumb { background: #555; }
        .cat { font: 400 11px/1.15 var(--pix); color: #fff; background: #0b0b0b; border: 1px solid #8a8a8a; padding: 7px 4px; text-align: center; cursor: pointer; }
        .cat:hover { background: #2a2a2a; }
        .cat.on { background: #d8d8d8; color: #000; border-color: #fff; }
        #strip { display: flex; align-items: center; gap: 6px; background: #000; border-top: 1px solid #8a8a8a; padding: 5px 6px; }
        #search-box { width: 130px; flex: none; margin: 0; padding: 6px 7px; background: #000; border: 1px solid #8a8a8a; color: #fff; font: 400 11px var(--pix); }
        #search-box:focus { border-color: #fff; }
        #palette-list { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 2px 1px 4px; }
        #palette-list::-webkit-scrollbar { height: 6px; } #palette-list::-webkit-scrollbar-thumb { background: #555; }
        .tile { flex: none; display: block; height: 30px; padding: 0 9px; font: 400 11px/28px var(--pix); white-space: nowrap; cursor: pointer;
                border: 1px solid rgba(255,255,255,0.35); outline: 0; }
        .tile:hover { filter: brightness(1.25); }
        .tile.alt { border: 2px solid #4fc3ff; line-height: 26px; }
        .tile.active { border: 2px solid #fff; line-height: 26px; box-shadow: 0 0 0 1px #000 inset; }
        .tile.active.alt { border-color: #fff; box-shadow: 0 0 0 2px #4fc3ff; }
        #bottom-bar { background: #000; border-top: 1px solid #8a8a8a; padding: 4px 6px; gap: 5px 16px; justify-content: flex-start; }
        .grp { gap: 4px; }
        .pbtn { font: 400 11px var(--pix); text-transform: none; background: #000; color: #fff; border: 1px solid #8a8a8a; box-shadow: none; padding: 6px 9px; }
        .pbtn:hover { background: #2a2a2a; color: #fff; }
        .pbtn.on, .pbtn.active { background: #d8d8d8; color: #000; }
        .pbtn.danger:hover { background: #a02030; color: #fff; }
        #speed-lbl { color: inherit; }
        .brush-box { font: 400 11px var(--pix); color: #fff; } .brush-box b { color: #fff; }
        input[type="range"] { accent-color: #d8d8d8; width: 80px; }
        #toast { background: #000; color: #fff; border: 1px solid #8a8a8a; font: 400 11px var(--pix); }
        #save-modal .box { background: #000; border: 1px solid #8a8a8a; box-shadow: none; }
        #save-modal h2 { font-weight: 400; text-shadow: none; }
        .slot { background: #000; border-color: #555; } .slot.cur { border-color: #fff; } .slot .meta b { color: #fff; }
        @media (max-width: 860px) {
            #main-container { flex-direction: column; }
            #canvas-wrapper { flex: 1; order: 1; }
            #sidebar { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-left: 0; border-top: 1px solid #8a8a8a; order: 2; }
            .cat { flex: none; padding: 6px 10px; }
            #search-box { width: 90px; }
            #bottom-bar { max-height: 28vh; overflow-y: auto; }
        }
    </style>
</head>
<body>

<div id="main-container">
    <div id="canvas-wrapper">
        <canvas id="sandbox"></canvas>
        <div id="toast"></div>
        <div id="hud">
            <span data-i18n="hud.fps"></span> <span id="hud-fps">60</span> &nbsp;Parts: <span id="hud-count">0</span><br>
            <span id="hud-hover"></span><br>
            <span data-i18n="hud.tool"></span> <b id="hud-el"></b>
        </div>
    </div>
    <div id="sidebar"></div>
</div>

<div id="strip">
    <input type="text" id="search-box" data-i18n-placeholder="ui.search" autocomplete="off">
    <div id="palette-list"></div>
</div>

<div id="bottom-bar">
    <div class="grp">
        <button id="btn-play"  class="pbtn on" data-i18n-title="ui.resume">Play</button>
        <button id="btn-pause" class="pbtn"    data-i18n-title="ui.pause">Pause</button>
        <button id="btn-ff"    class="pbtn"    data-i18n-title="ui.speed">Speed <span id="speed-lbl">x1</span></button>
        <button id="btn-step"  class="pbtn"    data-i18n-title="ui.step">Step</button>
    </div>
    <div class="grp">
        <button id="btn-eraser" class="pbtn" data-i18n-title="ui.eraser">Eraser</button>
        <button id="btn-dots1"  class="pbtn" data-i18n-title="ui.smallBrush">Small</button>
        <button id="btn-dots2"  class="pbtn" data-i18n-title="ui.largeBrush">Large</button>
        <div class="brush-box"><span data-i18n="ui.brush"></span> <b id="brush-val">4</b>
            <input type="range" id="brush-size" min="1" max="25" value="4">
        </div>
    </div>
    <div class="grp">
        <button id="btn-gravity" class="pbtn">Gravity: ON</button>
        <button id="btn-wind" class="pbtn">Wind: OFF</button>
        <button id="btn-thermal" class="pbtn">View: Normal</button>
        <button id="btn-shape" class="pbtn">Circle</button>
        <button id="btn-zoomin" class="pbtn" data-i18n-title="ui.zoomIn">Zoom +</button>
        <button id="btn-zoomout" class="pbtn" data-i18n-title="ui.zoomOut">Zoom -</button>
        <button id="btn-zoomreset" class="pbtn" data-i18n-title="ui.zoomReset">Reset</button>
        <button id="btn-sound" class="pbtn">Sound: ON</button>
        <button id="btn-help" class="pbtn">Help</button>
    </div>
    <div class="grp">
        <button id="btn-gen-world" class="pbtn">World</button>
        <button id="btn-gen-kitchen" class="pbtn">Kitchen</button>
        <button id="btn-gen-lab" class="pbtn">Lab</button>
        <button id="btn-gen-engine" class="pbtn">Engines</button>
        <button id="btn-undo" class="pbtn">Undo</button>
        <button id="btn-plan" class="pbtn">Plan</button>
        <button id="btn-save" class="pbtn">Save</button>
        <button id="btn-load" class="pbtn">Load</button>
        <button id="btn-clear" class="pbtn danger">Clear</button>
    </div>
</div>

<div id="save-modal"><div class="box">
    <h2 data-i18n="ui.saves"></h2>
    <div id="slots"></div>
    <div class="row">
        <button id="btn-export" class="pbtn" data-i18n="ui.export"></button>
        <button id="btn-import" class="pbtn" data-i18n="ui.import"></button>
        <button id="btn-modal-close" class="pbtn danger" data-i18n="ui.close"></button>
    </div>
</div></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ICON_RE = '[\\u{1F000}-\\u{1FAFF}\\u{2190}-\\u{21FF}\\u{2300}-\\u{23FF}\\u{2600}-\\u{27BF}\\u{2B00}-\\u{2BFF}\\u{FE0F}\\u{200D}]';
const ICON_TAIL = new RegExp(' ?' + ICON_RE + '+$', 'u'), ICON_ANY = new RegExp(ICON_RE + '+ ?', 'gu');
function noIcons(s) {
    s = String(s).replace(/👆/gu, '[Interact]').replace(/\u2192/g, '->');
    return s.replace(ICON_TAIL, '').replace(ICON_ANY, '');
}
function t(key, vars) {
    const d = LANGS[LANG], f = LANGS.en;
    let s = d && d[key] !== undefined ? d[key] : (f[key] !== undefined ? f[key] : key);
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return noIcons(s);
}
function registerLanguage(code, dict) { LANGS[code] = Object.assign({}, LANGS[code] || {}, dict); }
function applyStaticText() {
    document.documentElement.lang = LANG;
    document.title = t('ui.title');
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(n => { n.title = t(n.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(n => { n.placeholder = t(n.dataset.i18nPlaceholder); });
}
function setLanguage(code) {
    if (!LANGS[code]) return false;

    if (document.getElementById('save-modal').classList.contains('show')) renderSlots();
    return true;
}

})();

    const scaleX = (wrapper.clientWidth - 6) / WIDTH;
    const scaleY = (wrapper.clientHeight - 6) / HEIGHT;
    const scale = Math.max(1, Math.floor(Math.min(scaleX, scaleY) * 10) / 10);

}

    const tmpMeta = metaGrid[i1]; metaGrid[i1] = metaGrid[i2]; metaGrid[i2] = tmpMeta;
    const tmpT = T[i1]; T[i1] = T[i2]; T[i2] = tmpT;

function generateWorld() {
    resetWorld();
    for (let x = 0; x < WIDTH; x++) {
        const groundY = Math.floor(HEIGHT * 0.65 + Math.sin(x * 0.04) * 16 + Math.cos(x * 0.1) * 6);
        const waterLevel = Math.floor(HEIGHT * 0.72);
        for (let y = 0; y < HEIGHT; y++) {
            if (y > groundY + 14) setCell(x, y, ELEMENTS.STONE.id);
            else if (y > groundY + 3) setCell(x, y, ELEMENTS.DIRT.id);
            else if (y > groundY) setCell(x, y, ELEMENTS.SAND.id);
            else if (y === groundY && groundY < waterLevel) setCell(x, y, ELEMENTS.PLANT.id);
            else if (y > waterLevel) setCell(x, y, ELEMENTS.WATER.id);
        }
        if (x > 15 && x < WIDTH - 15 && groundY < waterLevel - 6 && Math.random() < 0.04) {
